name: CI

on:
  push:
    branches: [main,master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        
      - name: Install PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: pdm install

      - name: Run tests
        run: pdm run pytest -v --color=yes

      - name: Build package
        run: pdm build
